<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | ShopEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1>🛍️ ShopEase</h1>
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html" class="active">Cart</a>
            <a href="my-orders.html">My Orders</a>
        </nav>
    </header>

    <main>
        <h2 style="margin-bottom: 1.5rem; font-size: 1.8rem;">Shopping Cart 🛒</h2>

        <div class="cart-table-wrapper">
            <div id="cartContainer">
                <!-- Cart items dynamically listed here -->
            </div>
        </div>

        <div class="cart-summary">
            <h3 id="totalPrice">Total: ₹0</h3>
            <button id="checkoutButton" onclick="proceedToCheckout()">Proceed to Checkout →</button>
        </div>
    </main>

    <footer>
        <p>© 2026 ShopEase. All rights reserved.</p>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
