<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ShopEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1>🛍️ ShopEase</h1>
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main>
        <div class="checkout-form-container">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Shipping & Checkout</h2>

            <form id="checkoutForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number (10 Digits)</label>
                    <input type="tel" id="mobile" maxlength="10" placeholder="9876543210" required>
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <textarea id="address" rows="3" placeholder="Flat No, Street, Landmark" required></textarea>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="Guntur" required>
                </div>

                <div class="form-group">
                    <label for="pincode">Pincode (6 Digits)</label>
                    <input type="text" id="pincode" maxlength="6" placeholder="522124" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; font-size: 1rem; margin-top: 10px;">
                    Place Order Now 🛍️
                </button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 ShopEase. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
